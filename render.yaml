services:
  - type: web
    name: aftrhrs-nexora
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/tickets/types
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: test
      - key: PORT
        value: 10000
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: ADMIN_USERNAME
        value: nexora_admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: VENUE_NAME
        value: OPEN YOUR MOUTH CLUB & KITCHEN
      - key: VENUE_LOCATION
        value: Jubilee Hills, Hyderabad, Telangana, India
      - key: VENUE_MAPS_URL
        value: https://maps.google.com/?q=Open+Your+Mouth+Club+and+Kitchen+Jubilee+Hills+Hyderabad
